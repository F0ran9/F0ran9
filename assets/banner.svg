  <text x="890" y="34" text-anchor="end" font-family="Consolas, monospace" font-size="12" fill="#00D4FF" opacity="0.9">[ ONLINE ]</text>

  <path d="M0,218 Q 230,198 460,214 T 920,210 L920,230 L0,230 Z" fill="#00FF88" opacity="0.06"/>
