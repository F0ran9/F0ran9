<svg xmlns="http://www.w3.org/2000/svg" width="920" height="230" viewBox="0 0 920 230">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#12181F"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00FF88">
        <animate attributeName="stop-color" values="#00FF88;#00D4FF;#7C3AED;#00FF88" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#00D4FF">
        <animate attributeName="stop-color" values="#00D4FF;#7C3AED;#00FF88;#00D4FF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#00FF88;#00D4FF;#7C3AED" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="920" height="230" rx="18" fill="url(#bg)"/>
  <g stroke="#1F2730" stroke-width="1">
    <line x1="0" y1="46" x2="920" y2="46"/>
    <line x1="0" y1="92" x2="920" y2="92"/>
    <line x1="0" y1="138" x2="920" y2="138"/>
    <line x1="0" y1="184" x2="920" y2="184"/>
  </g>
  <g stroke="#1F2730" stroke-width="1">
