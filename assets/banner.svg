    <line x1="368" y1="0" x2="368" y2="230"/>
    <line x1="552" y1="0" x2="552" y2="230"/>
    <line x1="736" y1="0" x2="736" y2="230"/>
  </g>

  <text x="460" y="118" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', monospace" font-size="82" font-weight="700" letter-spacing="10" fill="#0D1117" stroke="url(#neon)" stroke-width="2.5" filter="url(#glow)">F0ran9</text>

  <text x="460" y="162" text-anchor="middle" font-family="Consolas, monospace" font-size="17" letter-spacing="5" fill="#8B949E">OFFENSIVE SECURITY · AI RED TEAM</text>

